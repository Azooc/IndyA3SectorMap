<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indy A3 Sector Map</title>
  <meta name="description" content="Memorize and self-test the Indy Area 3 sectors: names, sector numbers, altitudes and frequencies.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c1322'/%3E%3Cpath d='M5 11 19 5l2 6 6 2-3 14-12 0-7-9z' fill='none' stroke='%233f7bff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M12 9 15 27' stroke='%23ff4f3e' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved (or system) theme before first paint.
    (function () {
      var t = null;
      try { t = localStorage.getItem("a3-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body data-mode="answers">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M5 11 19 5l2 6 6 2-3 14-12 0-7-9z" fill="none" stroke="var(--line-hi)" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M12 9 15 27" stroke="var(--line-lo)" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>Indy A3 Sector Map</h1>
          <p class="sub">Names · sector numbers · altitudes · frequencies</p>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn" id="btn-clear" title="Empty every blank">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg>
          Clear
        </button>
        <button type="button" class="btn primary" id="btn-check" title="Check answers (Ctrl+Enter)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m4 10.5 4 4 8-9"/></svg>
          Check answers
        </button>
        <button type="button" class="btn" id="btn-fill" title="Show every answer">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 10s3-5.5 7.5-5.5S17.5 10 17.5 10 14.5 15.5 10 15.5 2.5 10 2.5 10Z"/><circle cx="10" cy="10" r="2.2"/></svg>
          Fill answers
        </button>
        <button type="button" class="btn ghost" id="btn-retry" title="Blank out only the ones you missed" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10a6 6 0 1 0 2-4.5M4 3.5V7h3.5"/></svg>
          Retry missed
        </button>
      </div>

      <div class="view-tools">
        <div class="zoom" role="group" aria-label="Zoom">
          <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
          <button type="button" id="zoom-fit" class="fit" aria-label="Fit map to width">Fit</button>
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
        </div>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle light / dark theme">
          <svg class="moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.5A6.5 6.5 0 0 1 7.5 4a6.5 6.5 0 1 0 8.5 8.5Z"/></svg>
          <svg class="sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <div class="statusbar" id="status" aria-live="polite"></div>
  </header>

  <main>
    <div class="map-scroll" id="map-scroll">
      <div class="map-sizer" id="map-sizer">
        <div class="map" id="map">
          <svg class="lines" id="lines" viewBox="0 0 833 843" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="labels" id="labels"></div>
        </div>
      </div>
    </div>

    <footer class="legend">
      <span class="key"><i class="swatch hi"></i>HI / IM / SH</span>
      <span class="key"><i class="swatch lo"></i>LO</span>
      <span class="key"><i class="chip ok">OK</i>Correct</span>
      <span class="key"><i class="chip bad">FIX</i>Missed — the correct answer is filled in (hover it to see what you typed)</span>
      <span class="hint"><kbd>Tab</kbd>/<kbd>Enter</kbd> next blank · <kbd>Shift</kbd>+<kbd>Enter</kbd> back · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> check</span>
    </footer>
  </main>

  <div class="tip" id="tip" role="tooltip" hidden></div>

  <script src="sectors.js"></script>
  <script src="app.js"></script>
</body>
</html>
